<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Clockwork Vault</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; }
  /* The game draws at 1280x800 and is scaled to fit the window, letterboxed. */
  #game { position: absolute; left: 50%; top: 50%; width: min(100vw, 160vh); height: min(62.5vw, 100vh);
          transform: translate(-50%, -50%); display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="The Clockwork Vault: a top-down museum heist. Sneak past lasers, cameras and guards, open the vault and steal the Clockwork Crown."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
